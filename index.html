<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f1e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="今天穿什么">
<title>今天穿什么</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f1e8;
  --card:#fffdf9;
  --ink:#24211d;
  --muted:#8b8177;
  --line:#e9e1d4;
  --accent:#b15a3c;
  --accent-deep:#92442b;
  --accent-soft:#f3e2d8;
  --sage:#6c7a66;
  --sage-soft:#e6ebe2;
  --shadow:0 1px 2px rgba(70,52,34,.04),0 10px 30px rgba(70,52,34,.06);
  --radius:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:16px;line-height:1.5;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
img{display:block}
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.muted{color:var(--muted)}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 20px 10px;
  background:linear-gradient(to bottom,rgba(246,241,232,.97),rgba(246,241,232,.82));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.brand{font-size:17px;font-weight:650;letter-spacing:.08em}
.brand span{color:var(--accent)}
.city-btn{
  display:flex;align-items:center;gap:5px;max-width:190px;
  padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.7);
  border:1px solid var(--line);font-size:13px;color:#5c534a;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.city-btn:active{background:#fff}
main{max-width:560px;margin:0 auto;padding:2px 16px 28px}
.tab{display:none;animation:fade .25s ease}
.tab.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- hero ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:26px;padding:20px 20px 16px;
  color:#fff;background:linear-gradient(140deg,#d9a066,#b15a3c);
  box-shadow:0 14px 34px rgba(150,85,50,.18);
}
.hero::after{
  content:"";position:absolute;width:220px;height:220px;border-radius:50%;
  right:-70px;top:-90px;background:rgba(255,255,255,.12);pointer-events:none;
}
.hero.sunny{background:linear-gradient(140deg,#eda75a,#c9662f)}
.hero.cloudy{background:linear-gradient(140deg,#9aa8ae,#61717b)}
.hero.rain{background:linear-gradient(140deg,#7f95a8,#48606f)}
.hero.snow{background:linear-gradient(140deg,#a9bdcb,#6f8797)}
.hero.night{background:linear-gradient(140deg,#5b6478,#363b4a)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative;z-index:1}
.hero-date{font-size:12px;opacity:.82;letter-spacing:.05em}
.hero-city{font-size:15px;font-weight:600;margin-top:2px}
.hero-emoji{font-size:40px;line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.12))}
.hero-temp{display:flex;align-items:flex-start;gap:2px;margin-top:6px;position:relative;z-index:1}
.temp-num{font-size:62px;font-weight:250;line-height:1.02;letter-spacing:-3px}
.deg{font-size:26px;font-weight:300;margin-top:8px;opacity:.85}
.hero-desc{font-size:15px;margin-left:10px;margin-top:20px;font-weight:500;opacity:.95}
.hero-sub{font-size:13px;opacity:.85;margin-top:2px;position:relative;z-index:1}
.hero-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;position:relative;z-index:1}
.hero-chips .chip{
  font-size:12px;padding:5px 10px;border-radius:999px;
  background:rgba(255,255,255,.17);backdrop-filter:blur(4px);white-space:nowrap;
}
.hero-foot{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin-top:14px;padding-top:11px;border-top:1px solid rgba(255,255,255,.22);
  font-size:11.5px;opacity:.88;position:relative;z-index:1;
}
.hero-foot button{
  font-size:11.5px;padding:4px 10px;border-radius:999px;
  background:rgba(255,255,255,.16);color:#fff;
}
.hero-foot button:active{background:rgba(255,255,255,.28)}
.hero.loading{min-height:210px;display:flex;align-items:center;justify-content:center;font-size:14px;opacity:.9}

/* ---------- sections ---------- */
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:24px 2px 10px}
.section-head h2{font-size:16px;font-weight:650;letter-spacing:.02em}
.section-head p{font-size:12px;color:var(--muted)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
.outfit-card{padding:16px 14px 14px}
.outfit-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.outfit-row::-webkit-scrollbar{display:none}
.outfit-item{flex:1 0 70px;min-width:70px;max-width:110px;text-align:center;position:relative}
.outfit-item .ph{
  aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:#f0e8db;
  display:flex;align-items:center;justify-content:center;font-size:26px;
  border:1px solid rgba(0,0,0,.03);
}
.outfit-item .ph img{width:100%;height:100%;object-fit:cover}
.outfit-item .oname{font-size:11px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.outfit-item .lock{
  position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;
  display:none;align-items:center;justify-content:center;font-size:10px;
  background:rgba(36,33,29,.62);color:#fff;backdrop-filter:blur(2px);
}
.outfit-item.locked .ph{outline:2px solid var(--accent);outline-offset:1px}
.outfit-item.locked .lock{display:flex}
.outfit-item .edit-badge{
  position:absolute;top:5px;left:5px;z-index:2;
  width:20px;height:20px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;line-height:1;color:#4a4139;background:rgba(255,255,255,.9);
  box-shadow:0 1px 4px rgba(0,0,0,.15);
}
.outfit-item .edit-badge:active{background:#fff}
.hint{font-size:11px;color:#a59a8e;text-align:center;margin-top:10px}
.reason{
  margin-top:14px;padding:12px 14px;border-radius:14px;
  background:linear-gradient(135deg,#faf2ea,#f6ebdf);border:1px solid #f0e0d1;
}
.reason p{font-size:13.5px;line-height:1.6;color:#5d4c3e}
.reason ul{margin:8px 0 0;padding-left:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.reason li{
  font-size:11.5px;color:#8a6047;background:rgba(255,255,255,.72);
  border:1px solid #efddcc;border-radius:999px;padding:4px 9px;
}
.actions{display:flex;gap:10px;margin-top:14px}
.btn{
  flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:13px 14px;border-radius:14px;font-size:14.5px;font-weight:600;
  transition:transform .12s ease,background .15s ease;
}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 8px 18px rgba(177,90,60,.22)}
.btn.primary:active{background:var(--accent-deep)}
.btn.ghost{background:#f1eae0;color:#5c534a;border:1px solid #e6dacb}
.btn.ghost:active{background:#ece2d5}
.btn.small{flex:0 0 auto;padding:9px 14px;font-size:13px;border-radius:11px}
.btn.danger{background:#fbe9e5;color:#a8402d;border:1px solid #f3d3ca}

/* locked-today note */
.done-banner{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:12px;padding:12px 14px;border-radius:16px;
  background:var(--sage-soft);border:1px solid #d9e1d4;font-size:12.5px;color:#4d5c48;
}
.done-banner strong{font-weight:650}

/* ---------- wardrobe ---------- */
.page-head{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 16px}
.page-head h2{font-size:22px;font-weight:650;letter-spacing:.01em}
.page-head p{font-size:12.5px;color:var(--muted);margin-top:2px}
.add-btn{
  display:flex;align-items:center;gap:4px;padding:9px 14px;border-radius:999px;
  background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;
  box-shadow:0 8px 20px rgba(36,33,29,.16);
}
.add-btn:active{background:#000}
.filters{display:flex;gap:8px;overflow-x:auto;padding:0 2px 14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{
  flex:0 0 auto;padding:7px 13px;border-radius:999px;font-size:13px;
  background:rgba(255,255,255,.66);border:1px solid var(--line);color:#6d6359;
}
.filter.active{background:var(--ink);border-color:var(--ink);color:#fff}
.filter .count{opacity:.55;font-size:11px;margin-left:3px}

/* ---------- occasion ---------- */
.occ-row{display:flex;align-items:center;gap:10px;margin:18px 2px 0;overflow-x:auto;scrollbar-width:none}
.occ-row::-webkit-scrollbar{display:none}
.occ-label{font-size:11.5px;color:var(--muted);flex:0 0 auto;letter-spacing:.02em}
.occ-chips{display:flex;gap:6px}
.occ-chip{
  flex:0 0 auto;font-size:12px;padding:6px 12px;border-radius:999px;
  background:rgba(255,255,255,.7);border:1px solid var(--line);color:#6d6359;
}
.occ-chip.active{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.style-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.style-tags span{
  font-size:11px;padding:4px 9px;border-radius:999px;
  background:#f3ece2;color:#7a6757;border:1px solid #eadfd2;
}
.opt{font-style:normal;font-size:10.5px;color:#b0a497;margin-left:4px;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.item-card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);text-align:left;border:1px solid rgba(0,0,0,.02)}
.item-card:active{transform:scale(.99)}
.item-ph{aspect-ratio:1/1.08;background:#f0e8db;display:flex;align-items:center;justify-content:center;font-size:34px;position:relative;overflow:hidden}
.item-ph img{width:100%;height:100%;object-fit:cover}
.item-edit{
  position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:12px;
  background:rgba(255,255,255,.86);color:#5c534a;
  box-shadow:0 1px 4px rgba(0,0,0,.12);pointer-events:none;
}
.item-meta{padding:10px 12px 12px}
.item-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-sub{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-top:3px}
.dot{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);flex:0 0 auto}
.empty{
  padding:44px 24px;text-align:center;background:var(--card);border-radius:22px;
  box-shadow:var(--shadow);
}
.empty .big{font-size:44px;line-height:1;margin-bottom:12px}
.empty h3{font-size:16px;font-weight:650;margin-bottom:6px}
.empty p{font-size:13px;color:var(--muted);line-height:1.7}
.empty .btn{margin-top:18px;max-width:220px;margin-left:auto;margin-right:auto}

/* ---------- logs ---------- */
.log-card{padding:14px;margin-bottom:12px}
.log-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.log-date{font-size:14.5px;font-weight:650}
.log-weather{font-size:11.5px;color:var(--muted)}
.log-thumbs{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.log-thumbs .t{
  width:52px;height:64px;border-radius:10px;overflow:hidden;background:#f0e8db;
  display:flex;align-items:center;justify-content:center;font-size:20px;
}
.log-thumbs .t img{width:100%;height:100%;object-fit:cover}
.log-del{font-size:11px;color:#a99e92;padding:4px 8px;border-radius:8px}
.log-del:active{background:#f3ece2}

/* ---------- settings ---------- */
.settings-card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  width:100%;padding:15px 16px;font-size:14.5px;text-align:left;
  border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:0}
.row:active{background:#faf5ec}
.row .val{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px}
.row.danger{color:#a8402d}
.note{font-size:12px;line-height:1.75;color:#9b9084;padding:2px 4px 8px}
.note b{color:#6d6359;font-weight:600}

/* ---------- tab bar ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  max-width:560px;margin:0 auto;
  background:rgba(255,253,249,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 0 7px;font-size:10.5px;color:#a1968a;
}
.tabbar button.active{color:var(--accent)}
.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- sheets ---------- */
.backdrop{
  position:fixed;inset:0;z-index:40;background:rgba(32,25,19,.44);
  opacity:0;pointer-events:none;transition:opacity .22s ease;
}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;
  max-width:560px;margin:0 auto;max-height:90vh;overflow-y:auto;overscroll-behavior:contain;
  background:var(--bg);border-radius:26px 26px 0 0;
  padding:8px 20px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .3s cubic-bezier(.22,.8,.24,1);
  box-shadow:0 -20px 60px rgba(40,30,20,.18);
}
.sheet.show{transform:none}
.handle{width:38px;height:4px;border-radius:99px;background:#d9cec0;margin:6px auto 16px}
.sheet-close{
  position:absolute;top:14px;right:16px;width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:17px;color:#8b8177;
  background:rgba(0,0,0,.045);
}
.sheet-close:active{background:rgba(0,0,0,.09)}
.sheet h3{font-size:19px;font-weight:650;margin-bottom:4px}
.sheet .sub{font-size:12.5px;color:var(--muted);margin-bottom:16px}
.field{display:block;margin-bottom:16px}
.field > .label{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:#7d7267;margin-bottom:7px}
.field .label b{color:var(--accent);font-weight:600}
.field input[type=text],.field input[type=search],.field textarea{
  width:100%;padding:12px 14px;border-radius:13px;border:1px solid var(--line);
  background:#fffdf9;outline:none;font-size:15px;
}
.field input:focus,.field textarea:focus{border-color:#d4b6a3;box-shadow:0 0 0 3px rgba(177,90,60,.08)}
.photo-drop{
  position:relative;height:190px;border-radius:18px;overflow:hidden;
  background:#efe7da;border:1.5px dashed #d8c9b7;
  display:flex;align-items:center;justify-content:center;margin-bottom:16px;
}
.photo-drop img{width:100%;height:100%;object-fit:cover}
.photo-hint{display:flex;flex-direction:column;align-items:center;gap:6px;color:#a09484;font-size:12.5px}
.photo-hint .cam{font-size:30px}
.photo-drop .change{
  position:absolute;right:10px;bottom:10px;padding:6px 11px;border-radius:999px;
  background:rgba(36,33,29,.6);color:#fff;font-size:11.5px;backdrop-filter:blur(4px);
}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-opt{
  padding:8px 13px;border-radius:999px;font-size:13px;
  background:#fffdf9;border:1px solid var(--line);color:#6d6359;
}
.chip-opt.active{background:var(--accent-soft);border-color:#e0bda9;color:var(--accent-deep);font-weight:600}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:99px;
  background:linear-gradient(to right,var(--accent) 0%,var(--accent) 50%,#e7ddd0 50%,#e7ddd0 100%);
  outline:none;margin:10px 0 2px;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:24px;height:24px;border-radius:50%;
  background:#fff;border:2px solid var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.15);
}
.range-labels{display:flex;justify-content:space-between;font-size:10.5px;color:#b0a497;margin-top:5px}
.color-row{display:flex;align-items:center;gap:10px}
.swatch{
  width:34px;height:34px;border-radius:50%;border:2px solid #fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.1),0 2px 6px rgba(0,0,0,.08);flex:0 0 auto;
}
.color-name{font-size:13.5px;flex:1}
.text-btn{font-size:12px;color:var(--accent);padding:6px 8px;border-radius:8px;background:var(--accent-soft)}
.swatch-presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.swatch-presets button{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.swatch-presets button.sel{outline:2px solid var(--ink);outline-offset:2px}
.color-tools{display:flex;gap:8px;margin-top:10px}
.color-tools .text-btn{border:1px solid #ecd9cc;background:var(--accent-soft);color:var(--accent-deep)}
.color-hint{font-size:11px;color:#a59a8e;line-height:1.55;margin-top:8px}
.sheet-actions{display:flex;gap:10px;margin-top:22px}
.sheet-actions .btn{flex:1}

/* city sheet */
.search-row{display:flex;gap:8px;margin-bottom:14px}
.search-row input{
  flex:1;padding:12px 14px;border-radius:13px;border:1px solid var(--line);
  background:#fffdf9;outline:none;font-size:15px;
}
.search-row input:focus{border-color:#d4b6a3;box-shadow:0 0 0 3px rgba(177,90,60,.08)}
.icon-btn{
  flex:0 0 auto;padding:0 14px;border-radius:13px;background:var(--ink);color:#fff;
  font-size:13px;display:flex;align-items:center;gap:4px;
}
.city-results{max-height:46vh;overflow-y:auto;margin:0 -4px 12px}
.city-item{
  display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;
  padding:13px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:14.5px;
}
.city-item:last-child{border-bottom:0}
.city-item .meta{font-size:11.5px;color:var(--muted)}
.city-presets{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.city-presets button{font-size:12.5px;padding:7px 12px;border-radius:999px;background:#f1e9de;color:#6d6359}
.ip-suggest{
  display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  padding:12px 14px;border-radius:14px;margin-bottom:12px;text-align:left;
  background:var(--accent-soft);border:1px solid #e6c8b8;font-size:13.5px;color:#6b3f2b;
}
.ip-suggest .use{font-size:12px;font-weight:600;color:var(--accent-deep);flex:0 0 auto}

/* ---------- 照片取色 ---------- */
.color-picker{
  position:fixed;inset:0;z-index:70;background:#141210;color:#fff;
  display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity .2s ease;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.color-picker.show{opacity:1;pointer-events:auto}
.picker-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;flex:0 0 auto}
.picker-top button{font-size:14px;color:#fff;padding:8px 12px;border-radius:10px}
.picker-top button:last-child{background:var(--accent);font-weight:650;color:#fff}
.picker-title{font-size:12.5px;color:rgba(255,255,255,.6);letter-spacing:.03em}
.picker-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;min-height:0}
.picker-stage img{max-width:calc(100vw - 20px);max-height:100%;width:auto;height:auto;user-select:none;-webkit-user-drag:none;border-radius:6px}
.picker-cross{
  position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;
  border:2px solid rgba(255,255,255,.95);
  box-shadow:0 0 0 1px rgba(0,0,0,.5), inset 0 0 0 1px rgba(0,0,0,.35);

}
.picker-loupe{
  position:absolute;width:96px;height:96px;border-radius:50%;

}
.picker-hint{
  position:absolute;left:0;right:0;bottom:10px;text-align:center;

}
.picker-bottom{
  display:flex;align-items:center;gap:14px;padding:14px 20px calc(16px + env(safe-area-inset-bottom));
  border-top:1px solid rgba(255,255,255,.08);flex:0 0 auto;
}
.picker-swatch{width:46px;height:46px;border-radius:14px;box-shadow:0 0 0 1px rgba(255,255,255,.2);flex:0 0 auto}
.picker-color{font-size:15px;font-weight:650}
.picker-hex{font-size:12px;color:rgba(255,255,255,.55);margin-top:2px;letter-spacing:.07em}
.picker-bottom .tip{margin-left:auto;font-size:10.5px;color:rgba(255,255,255,.38);text-align:right;max-width:150px;line-height:1.5}

/* toast */
.toast{
  position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  z-index:60;background:rgba(36,33,29,.92);color:#fff;font-size:13px;
  padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;max-width:86vw;text-align:center;
  backdrop-filter:blur(8px);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<script>
/* ============================================================
   今天穿什么 — 本地版每日穿搭助手
   数据只存在本机浏览器 IndexedDB，不上传服务器
   ============================================================ */

const CATS = {
  top:    { label:'上衣', emoji:'👕', warmth:3 },
  bottom: { label:'下装', emoji:'👖', warmth:3 },
  outer:  { label:'外套', emoji:'🧥', warmth:3 },
  shoes:  { label:'鞋子', emoji:'👟', warmth:2 },
  acc:    { label:'配饰', emoji:'🧣', warmth:2 }
};
const CAT_ORDER = ['top','bottom','outer','shoes','acc'];
const WARM_LABELS = ['','很薄','偏薄','适中','偏厚','厚实'];
const WARM_WORDS = ['','轻薄','偏薄','适中','偏厚','厚实'];
const NEUTRAL = new Set(['黑色','白色','灰色','深灰','浅灰','米白','米色','卡其色','棕色','藏蓝色','牛仔蓝']);
const PRESET_COLORS = [
  ['#111111','黑色'],['#3a3a3a','深灰'],['#8c8c8c','灰色'],['#c9c9c9','浅灰'],
  ['#f7f4ee','白色'],['#efe7d8','米白'],['#e3d5bf','米色'],['#d6c7ad','燕麦色'],
  ['#c2a878','卡其色'],['#b08968','驼色'],['#7a5236','棕色'],['#4a3428','咖啡色'],
  ['#6e1f2a','酒红'],['#a83232','红色'],['#d97a5a','橙色'],['#e0b64a','黄色'],
  ['#5b7b9a','牛仔蓝'],['#7f9fc0','浅蓝'],['#24324f','藏蓝色'],['#4f7f8a','雾霾蓝'],
  ['#4c6b4f','绿色'],['#6f7d5a','军绿'],['#a8c3a0','薄荷绿'],['#e8b4b8','粉色'],
  ['#8a6f9e','紫色']
];
const TAGS = [['waterproof','防水'],['windproof','防风'],['breathable','透气'],['formal','正式'],['sport','运动']];
const DAY_NAMES = ['周日','周一','周二','周三','周四','周五','周六'];

/* ---------------- 审美规则 ---------------- */
const STYLES = { casual:'休闲', commute:'通勤', sport:'运动', sweet:'温柔', street:'街头', retro:'复古' };
const FITS = { loose:'宽松', regular:'合身', slim:'修身' };
const PATTERNS = { solid:'纯色', stripe:'条纹', check:'格纹', print:'印花' };
const OCCASIONS = { commute:'通勤', casual:'休闲', sport:'运动', date:'约会' };

// 风格之间的协调度（0–3）
const STYLE_MATRIX = {
  casual:  { casual:3,   street:2.4, sport:2.0, sweet:1.6, commute:1.2, retro:1.2 },
  commute: { commute:3,  sweet:2.4,  retro:2.0, casual:1.4, street:0.6, sport:0.2 },
  sport:   { sport:3,    casual:2.0, street:1.4, commute:0.5, sweet:0.4, retro:0.3 },
  sweet:   { sweet:3,    commute:2.4, casual:1.8, retro:1.6, street:1.0, sport:0.3 },
  street:  { street:3,   casual:2.4, sport:1.8, retro:1.5, sweet:1.1, commute:0.6 },
  retro:   { retro:3,    sweet:2.0,  commute:1.8, casual:1.4, street:1.3, sport:0.3 }
};

// 场合对风格的偏好（负分表示不推荐）
const OCCASION_STYLE = {
  commute: { commute:2.2, sweet:1.2, retro:1.0, casual:0.4, street:0.0, sport:-0.8 },
  casual:  { casual:2.0,  street:1.2, sport:1.0, sweet:0.8, retro:0.6, commute:0.2 },
  sport:   { sport:2.4,   casual:1.0, street:0.6, commute:-0.6, sweet:-0.8, retro:-0.6 },
  date:    { sweet:2.2,   retro:1.2, commute:1.0, casual:0.6, street:0.4, sport:-1.0 }
};

// 2026 流行配色（云舞白 / 燕麦格雷 / 美拉德 / 黄油奶油 / 雾粉 / 权力蓝 / 开心果绿）
const TREND_PALETTES = [
  { key:'cloud',     name:'云舞白',   core:['白色','米白','米色'],           anchors:['浅灰','灰色','黑色','卡其色'] },
  { key:'oatmeal',   name:'燕麦格雷', core:['浅灰','灰色','深灰','米色'],     anchors:['白色','米白','黑色'] },
  { key:'maillard',  name:'美拉德',   core:['棕色','酒红','橙色','卡其色'],   anchors:['米白','米色','黑色'] },
  { key:'butter',    name:'黄油奶油', core:['黄色','米色','卡其色'],          anchors:['白色','棕色','米白'] },
  { key:'powder',    name:'雾粉',     core:['粉色','紫色'],                  anchors:['米白','白色','灰色','酒红'] },
  { key:'power',     name:'权力蓝',   core:['蓝色','藏蓝色','浅蓝'],          anchors:['白色','黑色','灰色'] },
  { key:'pistachio', name:'开心果绿', core:['绿色','军绿'],                  anchors:['米白','棕色','卡其色'] }
];

const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];
const clamp = (n,a,b) => Math.max(a, Math.min(b, n));
const uid = () => 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------------- storage ---------------- */
const DB_NAME = 'outfit-db', DB_VER = 1;
let db = null;

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains('items')) d.createObjectStore('items', { keyPath:'id' });
      if(!d.objectStoreNames.contains('logs')) d.createObjectStore('logs', { keyPath:'id' });
      if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
    };
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onerror = () => reject(req.error);
  });
}
function dbAll(store){
  return new Promise((resolve, reject) => {
    const r = db.transaction(store, 'readonly').objectStore(store).getAll();
    r.onsuccess = () => resolve(r.result || []);
    r.onerror = () => reject(r.error);
  });
}
function dbPut(store, val){
  return new Promise((resolve, reject) => {
    const r = db.transaction(store, 'readwrite').objectStore(store).put(val);
    r.onsuccess = () => resolve();
    r.onerror = () => reject(r.error);
  });
}
function dbDel(store, key){
  return new Promise((resolve, reject) => {
    const r = db.transaction(store, 'readwrite').objectStore(store).delete(key);
    r.onsuccess = () => resolve();
    r.onerror = () => reject(r.error);
  });
}
function metaGet(key){
  return new Promise((resolve, reject) => {
    const r = db.transaction('meta', 'readonly').objectStore('meta').get(key);
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
function metaPut(key, val){
  return new Promise((resolve, reject) => {
    const r = db.transaction('meta', 'readwrite').objectStore('meta').put(val, key);
    r.onsuccess = () => resolve();
    r.onerror = () => reject(r.error);
  });
}

/* ---------------- state ---------------- */
const state = {
  tab: 'today',
  items: [],
  logs: [],
  settings: { city: null },
  weather: null,
  weatherAt: 0,
  rec: null,
  weatherError: false,
  ipCity: null,
  occasion: 'commute',
  locks: new Set(),
  filter: 'all',
  editing: null
};
let form = null;

/* ---------------- utils ---------------- */
function pad(n){ return String(n).padStart(2,'0'); }
function localDate(d=new Date()){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function daysSince(dateStr){
  if(!dateStr) return 999;
  const now = new Date(); now.setHours(12,0,0,0);
  const then = new Date(dateStr + 'T12:00:00');
  return Math.round((now - then) / 86400000);
}
function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ---------------- color ---------------- */
function hexToRgb(hex){
  let h = String(hex || '').replace('#','').trim();
  if(h.length === 3) h = h.split('').map(c => c + c).join('');
  if(h.length !== 6) return { r:200, g:170, b:120 };
  return { r:parseInt(h.slice(0,2),16), g:parseInt(h.slice(2,4),16), b:parseInt(h.slice(4,6),16) };
}
function rgbToHex(r,g,b){
  const f = n => clamp(Math.round(n),0,255).toString(16).padStart(2,'0');
  return '#' + f(r) + f(g) + f(b);
}
function rgbToHsl(r,g,b){
  r/=255; g/=255; b/=255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b);
  const l = (mx+mn)/2;
  let h = 0, s = 0;
  if(mx !== mn){
    const d = mx - mn;
    s = l > .5 ? d/(2-mx-mn) : d/(mx+mn);
    if(mx === r) h = (g-b)/d + (g<b?6:0);
    else if(mx === g) h = (b-r)/d + 2;
    else h = (r-g)/d + 4;
    h *= 60;
  }
  return { h, s, l };
}
function colorName(hex){
  const { r,g,b } = hexToRgb(hex);
  const { h,s,l } = rgbToHsl(r,g,b);
  if(l >= .94 && s < .2) return '白色';
  if(l <= .12) return '黑色';
  if(s < .09){
    if(l < .32) return '深灰';
    if(l > .74) return '浅灰';
    return '灰色';
  }
  if(h >= 20 && h <= 55){
    if(l < .33) return '棕色';
    if(s < .48 && l > .78) return '米白';
    if(s < .55 && l > .55) return '卡其色';
  }
  if(h >= 345 || h < 15){
    if(l < .33) return '酒红';
    if(l > .74 && s < .75) return '粉色';
    return '红色';
  }
  if(h < 35) return '橙色';
  if(h < 65) return '黄色';
  if(h < 160){
    if(s < .38 && l < .42) return '军绿';
    return '绿色';
  }
  if(h < 200) return '青色';
  if(h < 250){
    if(l < .28) return '藏蓝色';
    if(l > .76) return '浅蓝';
    return '蓝色';
  }
  if(h < 290) return '紫色';
  return '紫红色';
}
function hueDist(a,b){
  const d = Math.abs(a-b) % 360;
  return d > 180 ? 360-d : d;
}
function isNeutralName(name){ return NEUTRAL.has(name); }
function harmony(a,b){
  if(!a.hex || !b.hex || !a.colorName || !b.colorName) return 1.7;
  const na = isNeutralName(a.colorName), nb = isNeutralName(b.colorName);
  if(a.colorName === '白色' || b.colorName === '白色') return 3;
  if(na && nb) return 3;
  if(na || nb) return 2.4;
  const A = rgbToHsl(hexToRgb(a.hex).r, hexToRgb(a.hex).g, hexToRgb(a.hex).b);
  const B = rgbToHsl(hexToRgb(b.hex).r, hexToRgb(b.hex).g, hexToRgb(b.hex).b);
  const dh = hueDist(A.h, B.h);
  if(dh <= 25) return 2.4;
  if(dh >= 150) return 2;
  return .8;
}
function harmonyScore(item, others){
  if(!others || !others.length) return 1.7;
  let sum = 0, n = 0;
  for(const o of others){ if(o && o.id !== item.id){ sum += harmony(item,o); n++; } }
  return n ? sum/n : 1.7;
}

/* ---------------- 审美：风格 / 版型 / 图案 / 流行配色 ---------------- */
function inferStyle(it){
  if(!it) return 'casual';
  if(it.style && STYLES[it.style]) return it.style;
  if(it.tags?.includes('sport')) return 'sport';
  if(it.tags?.includes('formal')) return 'commute';
  return 'casual';
}
function itemStyle(it){ return inferStyle(it); }
function itemFit(it){ return (it && it.fit) || 'regular'; }
function itemPattern(it){ return (it && it.pattern) || 'solid'; }

// 一套穿搭最贴近的 2026 流行配色
function bestPalette(items){
  const list = (items || []).filter(Boolean);
  if(list.length < 2) return null;
  let best = null;
  for(const p of TREND_PALETTES){
    let core = 0, anchor = 0;
    for(const it of list){
      const n = it.colorName || colorName(it.hex);
      if(p.core.includes(n)) core++;
      else if(p.anchors.includes(n)) anchor++;
    }
    if(!core) continue;
    const score = core * 1.4 + anchor * 0.45;
    if(!best || score > best.score) best = { ...p, score, core, anchor };
  }
  return best;
}
function paletteStrength(items){
  if(!items || items.length < 2) return 0.4;
  const p = bestPalette(items);
  return p ? Math.min(3, p.score) : 0.3;
}

function styleAffinity(a, b){
  const A = itemStyle(a), B = itemStyle(b);
  const row = STYLE_MATRIX[A];
  return row && row[B] != null ? row[B] : 1.2;
}
function styleCoherence(candidate, chosen, occasion){
  const others = Object.values(chosen).filter(Boolean).filter(o => o.id !== candidate.id);
  let pair = 1.6;
  if(others.length){
    let sum = 0, n = 0;
    for(const o of others){ sum += styleAffinity(candidate, o); n++; }
    pair = sum / n;
  }
  const occ = (OCCASION_STYLE[occasion] || {})[itemStyle(candidate)] || 0;
  return Math.max(0, pair + occ);
}

// 上宽下窄 / 上窄下宽 更利落；上下都宽只适合街头
function fitBalance(candidate, chosen){
  const top = candidate.category === 'top' ? candidate : chosen.top;
  const bottom = candidate.category === 'bottom' ? candidate : chosen.bottom;
  if(!top || !bottom) return 1.2;
  const tf = itemFit(top), bf = itemFit(bottom);
  if(tf === 'loose' && bf === 'slim') return 3;
  if(tf === 'slim' && bf === 'loose') return 3;
  if(tf === 'loose' && bf === 'loose'){
    return (itemStyle(top) === 'street' || itemStyle(bottom) === 'street') ? 1.8 : 0.7;
  }
  if(tf === 'slim' && bf === 'slim') return 1.4;
  return 2;
}

// 全身只保留一个图案作焦点
function patternBalance(candidate, chosen){
  const others = Object.values(chosen).filter(Boolean).filter(o => o.id !== candidate.id);
  const patterned = others.filter(o => itemPattern(o) !== 'solid').length;
  const candPattern = itemPattern(candidate) !== 'solid';
  if(candPattern){
    if(patterned === 0) return 1.6;
    if(patterned === 1) return 0.2;
    return 0;
  }
  return patterned === 0 ? 1.3 : 1.7;
}

// 从「记下这套」的历史里学习偏好
function learningProfile(){
  const styleCount = {}, colorCount = {}, pairCount = {};
  let total = 0;
  for(const log of state.logs){
    const its = (log.itemIds || []).map(id => state.items.find(i => i.id === id)).filter(Boolean);
    for(const it of its){
      const st = itemStyle(it);
      styleCount[st] = (styleCount[st] || 0) + 1;
      if(it.colorName) colorCount[it.colorName] = (colorCount[it.colorName] || 0) + 1;
      total++;
    }
    for(let i = 0; i < its.length; i++){
      for(let j = i + 1; j < its.length; j++){
        const k = [its[i].id, its[j].id].sort().join('|');
        pairCount[k] = (pairCount[k] || 0) + 1;
      }
    }
  }
  return { styleCount, colorCount, pairCount, total };
}
function learnedAffinity(it, chosen, learn){
  if(!learn || !learn.total) return 0;
  let s = 0;
  s += Math.min(1.6, (learn.styleCount[itemStyle(it)] || 0) / learn.total * 4);
  s += Math.min(1.0, (learn.colorCount[it.colorName] || 0) / learn.total * 3);
  for(const o of Object.values(chosen)){
    if(!o) continue;
    const k = [it.id, o.id].sort().join('|');
    s += Math.min(1.0, (learn.pairCount[k] || 0) * 0.5);
  }
  return Math.min(2.6, s);
}

function evaluateOutfit(chosen, occasion){
  const items = Object.values(chosen).filter(Boolean);
  const p = bestPalette(items);
  const counts = {};
  for(const it of items) counts[itemStyle(it)] = (counts[itemStyle(it)] || 0) + 1;
  let styleKey = 'casual', max = -1;
  for(const [k, v] of Object.entries(counts)){
    const occScore = (OCCASION_STYLE[occasion] || {})[k] || 0;
    const bestOcc = (OCCASION_STYLE[occasion] || {})[styleKey] || 0;
    if(v > max || (v === max && occScore > bestOcc)){ max = v; styleKey = k; }
  }
  return {
    palette: p ? p.name : '中性色',
    paletteKey: p ? p.key : null,
    styleKey,
    styleLabel: STYLES[styleKey] || '休闲'
  };
}

/* ---------------- image ---------------- */
function loadImage(src){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
async function compressImage(file, max = 900, quality = .78){
  let bmp;
  try{
    bmp = await createImageBitmap(file, { imageOrientation:'from-image' });
  }catch(e){
    const url = URL.createObjectURL(file);
    bmp = await loadImage(url);
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  }
  const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width * scale));
  const h = Math.max(1, Math.round(bmp.height * scale));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0,0,w,h);
  ctx.drawImage(bmp, 0, 0, w, h);
  if(bmp.close) bmp.close();
  return c.toDataURL('image/jpeg', quality);
}
async function extractColor(dataUrl){
  const img = await loadImage(dataUrl);
  const W = 160;
  const H = Math.max(1, Math.round(img.height / img.width * W));
  const c = document.createElement('canvas');
  c.width = W;
  c.height = H;
  const ctx = c.getContext('2d', { willReadFrequently:true });
  ctx.drawImage(img, 0, 0, W, H);
  const data = ctx.getImageData(0, 0, W, H).data;

  const diff = (a, b) => Math.sqrt((a.r-b.r)**2 + (a.g-b.g)**2 + (a.b-b.b)**2);
  const blockAvg = (x, y, s) => {
    const d = ctx.getImageData(x, y, s, s).data;
    let r = 0, g = 0, b = 0, n = 0;
    for(let i = 0; i < d.length; i += 4){ r += d[i]; g += d[i+1]; b += d[i+2]; n++; }
    return { r: r/n, g: g/n, b: b/n };
  };

  // 四角颜色一致时，当作背景色排除（白墙、床单、桌面等）
  const s = 8;
  const corners = [
    blockAvg(2, 2, s),
    blockAvg(Math.max(0, W-s-2), 2, s),
    blockAvg(2, Math.max(0, H-s-2), s),
    blockAvg(Math.max(0, W-s-2), Math.max(0, H-s-2), s)
  ];
  let maxDiff = 0;
  for(let i = 0; i < 4; i++){
    for(let j = i+1; j < 4; j++) maxDiff = Math.max(maxDiff, diff(corners[i], corners[j]));
  }
  let bg = null;
  if(maxDiff < 42){
    bg = {
      r: corners.reduce((v, p) => v + p.r, 0) / 4,
      g: corners.reduce((v, p) => v + p.g, 0) / 4,
      b: corners.reduce((v, p) => v + p.b, 0) / 4
    };
  }

  // 只看画面中间 72%，并按颜色占比 + 饱和度选主色
  const x0 = Math.floor(W * .14), x1 = Math.ceil(W * .86);
  const y0 = Math.floor(H * .14), y1 = Math.ceil(H * .86);
  const buckets = new Map();
  for(let y = y0; y < y1; y++){
    for(let x = x0; x < x1; x++){
      const i = (y * W + x) * 4;
      if(data[i+3] < 180) continue;
      const px = { r: data[i], g: data[i+1], b: data[i+2] };
      if(bg && diff(px, bg) < 38) continue;
      if(px.r > 242 && px.g > 242 && px.b > 242) continue;
      if(px.r < 10 && px.g < 10 && px.b < 10) continue;
      const key = `${px.r>>4},${px.g>>4},${px.b>>4}`;
      const e = buckets.get(key) || { n:0, r:0, g:0, b:0 };
      e.n++; e.r += px.r; e.g += px.g; e.b += px.b;
      buckets.set(key, e);
    }
  }

  let best = null, bestScore = 0;
  for(const e of buckets.values()){
    const r = e.r / e.n, g = e.g / e.n, b = e.b / e.n;
    const { s: sat } = rgbToHsl(r, g, b);
    const score = e.n * (0.7 + sat * 1.6);
    if(score > bestScore){ bestScore = score; best = { r, g, b }; }
  }
  if(best) return rgbToHex(best.r, best.g, best.b);

  // 纯白/纯黑衣服可能被全部过滤掉，退回中心像素
  const mid = ((H >> 1) * W + (W >> 1)) * 4;
  return rgbToHex(data[mid], data[mid+1], data[mid+2]);
}

}

async function fetchWeather(city){
  const params = new URLSearchParams({
    latitude: city.lat,
    longitude: city.lon,
    current: 'temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,is_day',
    hourly: 'temperature_2m,apparent_temperature,precipitation_probability,weather_code',
    daily: 'weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,sunrise,sunset,uv_index_max,precipitation_probability_max,wind_speed_10m_max',
    timezone: 'auto',
    forecast_days: '2',
    wind_speed_unit: 'kmh'
  });
  const res = await fetch('https://api.open-meteo.com/v1/forecast?' + params.toString(), { cache:'no-store' });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const d = await res.json();
  if(!d.current || !d.hourly) throw new Error('bad weather data');

  const date = d.current.time.slice(0,10);
  const idx = d.hourly.time.map((t,i) => ({ t, i })).filter(x => x.t.startsWith(date));
  const dayIdx = idx.filter(x => {
    const hr = +x.t.slice(11,13);
    return hr >= 7 && hr <= 22;
  });
  const feelsArr = dayIdx.map(x => d.hourly.apparent_temperature[x.i]).filter(v => v != null);
  const coldT = feelsArr.length ? Math.min(...feelsArr) : d.current.apparent_temperature;
  const warmT = feelsArr.length ? Math.max(...feelsArr) : d.current.apparent_temperature;
  const precipArr = dayIdx.map(x => d.hourly.precipitation_probability[x.i]).filter(v => v != null);
  const rainProb = Math.max(0, ...precipArr, d.daily.precipitation_probability_max?.[0] ?? 0);

  const atHour = h => {
    const found = idx.find(x => +x.t.slice(11,13) === h);
    return found ? d.hourly.temperature_2m[found.i] : null;
  };

  return {
    date,
    temp: Math.round(d.current.temperature_2m),
    feels: Math.round(d.current.apparent_temperature),
    humidity: d.current.relative_humidity_2m,
    wind: Math.round(d.current.wind_speed_10m),
    code: d.current.weather_code,
    isDay: d.current.is_day,
    ...weatherInfo(d.current.weather_code, d.current.is_day),
    tMax: Math.round(d.daily.temperature_2m_max[0]),
    tMin: Math.round(d.daily.temperature_2m_min[0]),
    coldT: Math.round(coldT),
    warmT: Math.round(warmT),
    rainProb: Math.round(rainProb),
    uv: Math.round(d.daily.uv_index_max?.[0] ?? 0),
    sunrise: (d.daily.sunrise?.[0] || '').slice(11,16),
    sunset: (d.daily.sunset?.[0] || '').slice(11,16),
    morning: atHour(8) != null ? Math.round(atHour(8)) : null,
    noon: atHour(14) != null ? Math.round(atHour(14)) : null,
    evening: atHour(20) != null ? Math.round(atHour(20)) : null,
    fetchedAt: Date.now()
  };
}

async function searchCity(q){
  const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=zh&format=json`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('search failed');
  const d = await res.json();
  return (d.results || []).map(r => ({
    name: r.name,
    admin: r.admin1 || '',
    country: r.country || '',
    lat: r.latitude,
    lon: r.longitude
  }));
}

async function guessCityByIP(){
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 5000);
  try{
    const res = await fetch('https://ipwho.is/', { signal: ctrl.signal });
    const d = await res.json();
    if(d && d.success !== false && d.latitude != null){
      return { name: d.city || d.region || '当前位置', admin: d.region || '', country: d.country || '', lat: d.latitude, lon: d.longitude };
    }
  }finally{
    clearTimeout(t);
  }
  throw new Error('ip lookup failed');
}

async function reverseName(lat, lon){
  try{
    const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh`);
    const d = await res.json();
    return d.city || d.locality || d.principalSubdivision || '当前位置';
  }catch(e){
    return '当前位置';
  }
}

/* ---------------- recommendation ---------------- */
function topTarget(t){
  if(t >= 25) return 1;
  if(t >= 21) return 2;
  if(t >= 17) return 3;
  if(t >= 13) return 4;
  return 5;
}
function bottomTarget(t){
  if(t >= 24) return 1;
  if(t >= 18) return 2;
  if(t >= 10) return 3;
  if(t >= 3) return 4;
  return 5;
}
function shoeTarget(t){
  if(t >= 25) return 1;
  if(t >= 15) return 2;
  if(t >= 5) return 3;
  if(t >= -5) return 4;
  return 5;
}
function outerTargetFor(coldT){
  if(coldT >= 19) return 0;
  if(coldT >= 15) return 1;
  if(coldT >= 11) return 2;
  if(coldT >= 7) return 3;
  if(coldT >= 1) return 4;
  return 5;
}

function buildOutfit(lockIds = new Set()){
  const w = state.weather;
  if(!w || !state.items.length) return null;
  const occasion = OCCASIONS[state.occasion] ? state.occasion : 'commute';
  const learn = learningProfile();

  const coldT = w.coldT, warmT = w.warmT;
  const targets = {
    top: topTarget(warmT),
    bottom: bottomTarget(coldT + 3),
    outer: outerTargetFor(coldT),
    shoes: shoeTarget(Math.round((coldT + warmT) / 2)),
    acc: coldT < 8 ? 3 : 2
  };
  if(targets.outer >= 3) targets.top = Math.max(1, targets.top - 1);

  const needOuter = targets.outer > 0;
  const chosen = {};
  for(const id of lockIds){
    const it = state.items.find(x => x.id === id);
    if(it) chosen[it.category] = it;
  }

  const order = ['top','bottom','outer','shoes','acc'];
  for(const cat of order){
    if(chosen[cat]) continue;
    if(cat === 'outer' && !needOuter) continue;
    if(cat === 'acc'){
      const pool = state.items.filter(i => i.category === 'acc');
      if(!pool.length) continue;
      if(!(coldT < 10 || w.uv >= 6)) continue;
    }
    chosen[cat] = pickBest(cat, targets[cat], chosen, w, occasion, learn);
  }

  const items = CAT_ORDER.map(c => chosen[c]).filter(Boolean);
  const look = evaluateOutfit(chosen, occasion);
  return {
    chosen, targets, items,
    tips: buildTips(w, look),
    sentence: outfitSentence(w, chosen, targets, occasion, look.palette),
    palette: look.palette,
    styleLabel: look.styleLabel,
    occasion,
    occasionLabel: OCCASIONS[occasion],
    stamp: state.weatherAt
  };
}

function pickBest(cat, target, chosen, w, occasion, learn){
  let pool = state.items.filter(i => i.category === cat);
  if(!pool.length) return null;

  // 先按保暖度圈定可接受的单品，审美再在范围内挑选
  const distances = pool.map(i => Math.abs((i.warmth || 3) - target));
  const minDist = Math.min(...distances);
  const maxDist = minDist <= 1 ? 1 : minDist;
  pool = pool.filter(i => Math.abs((i.warmth || 3) - target) <= maxDist);

  const rain = w.rainProb >= 50;
  const windy = w.wind >= 25;
  const hot = w.warmT >= 28;
  const humid = w.humidity >= 80;
  let best = null, bestScore = -Infinity;

  for(const it of pool){
    let s = 0;
    const d = Math.abs((it.warmth || 3) - target);
    s += d === 0 ? 2.2 : 0.6;

    const chosenArr = Object.values(chosen);
    s += harmonyScore(it, chosenArr) * 1.25;
    s += styleCoherence(it, chosen, occasion) * 1.25;
    s += fitBalance(it, chosen) * 0.9;
    s += patternBalance(it, chosen) * 1.0;
    s += paletteStrength([...chosenArr, it]) * 1.1;
    s += learnedAffinity(it, chosen, learn) * 0.8;

    if(it.lastWorn){
      const dd = daysSince(it.lastWorn);
      if(dd <= 1) s -= 5;
      else if(dd <= 3) s -= 2.5;
      else if(dd <= 7) s -= 1;
    }
    if(rain && it.tags?.includes('waterproof')) s += cat === 'outer' ? 5 : 2;
    if(windy && it.tags?.includes('windproof')) s += 2;
    if(hot && it.tags?.includes('breathable')) s += 1.5;
    if(humid && hot && it.tags?.includes('breathable')) s += 1.2;
    if(humid && w.coldT <= 10 && it.tags?.includes('windproof')) s += 1;
    s += Math.random() * 1.8;

    if(s > bestScore){ bestScore = s; best = it; }
  }
  return best;
}

function buildTips(w, look){
  const tips = [];
  const gap = w.warmT - w.coldT;
  if(gap >= 9) tips.push(`昼夜温差 ${gap}℃，外套方便穿脱`);
  if(w.coldT <= 4) tips.push('早晚很冷，注意保暖');
  if(w.warmT >= 30) tips.push('天气炎热，选轻薄透气的衣服');
  if(w.rainProb >= 50) tips.push(`降水概率 ${w.rainProb}%，记得带伞`);
  if(w.wind >= 25) tips.push('风比较大，外套选防风的');
  if(w.humidity >= 80 && w.warmT >= 22) tips.push('湿度偏高，优先透气面料');
  if(w.humidity >= 80 && w.coldT <= 10) tips.push('湿冷体感更明显，注意防风保暖');
  if(w.uv >= 6) tips.push(`紫外线较强（${w.uv}），注意防晒`);
  if(look && look.palette && look.palette !== '中性色') tips.push(`配色：${look.palette}`);
  if(look && look.styleLabel) tips.push(`风格：${look.styleLabel}`);
  if(!tips.length) tips.push('天气舒适，按平时的穿法就好');
  return tips.slice(0, 5);
}

function outfitSentence(w, chosen, targets, occasion, palette){
  const parts = [];
  if(chosen.outer) parts.push((WARM_WORDS[chosen.outer.warmth || targets.outer] || '适中') + '外套');
  if(chosen.top) parts.push((WARM_WORDS[chosen.top.warmth || targets.top] || '适中') + '上衣');
  if(chosen.bottom) parts.push((WARM_WORDS[chosen.bottom.warmth || targets.bottom] || '适中') + '下装');
  if(!parts.length) return `今天体感 ${w.coldT}–${w.warmT}℃，${w.desc}。`;
  const occ = OCCASIONS[occasion] || '通勤';
  const pal = palette && palette !== '中性色' ? `，配色走${palette}` : '';
  return `今天体感 ${w.coldT}–${w.warmT}℃，${w.desc}。按${occ}场合${pal}，穿${parts.join(' + ')}刚好。`;
}

function occasionKey(){ return 'outfit.occasion.' + localDate(); }
function defaultOccasion(){
  const d = new Date().getDay();
  return (d === 0 || d === 6) ? 'casual' : 'commute';
}
function loadOccasion(){
  let saved = null;
  try{ saved = localStorage.getItem(occasionKey()); }catch(e){}

}

}

      <div class="hero loading" style="display:block;padding:26px 20px;text-align:center">
        <div style="font-size:34px;margin-bottom:10px">🧭</div>
        <div style="font-size:15px;font-weight:600;margin-bottom:4px">先设置一下城市</div>
        <div style="font-size:12.5px;opacity:.82;margin-bottom:14px">这样才能知道今天该穿多少</div>
        <button class="btn primary" id="pickCityBtn" style="max-width:200px;margin:0 auto;background:#fff;color:var(--accent);box-shadow:none">选择城市</button>
      </div>`);
  } else if(!w){
    out.push(state.weatherError
      ? `<div class="hero loading" style="display:block;padding:26px 20px;text-align:center">
          <div style="font-size:34px;margin-bottom:10px">📡</div>
          <div style="font-size:15px;font-weight:600;margin-bottom:4px">天气没取到</div>
          <div style="font-size:12.5px;opacity:.82;margin-bottom:14px">检查一下网络，再试一次</div>
          <button class="btn primary" id="retryWeather" style="max-width:200px;margin:0 auto;background:#fff;color:var(--accent);box-shadow:none">重新获取</button>
        </div>`
      : `<div class="hero loading">正在获取 ${esc(city.name)} 的天气…</div>`);
  } else {
    out.push(heroHTML(w, city));
  }

  if(w){
    if(!state.items.length){
      out.push(emptyWardrobeCard());
    } else {
      out.push(occasionHTML());
      if(!state.rec || state.rec.stamp !== state.weatherAt){
        state.rec = buildOutfit(state.locks);
      }
      if(state.rec) out.push(recHTML(w));
    }
    const todayLog = state.logs.find(l => l.id === w.date);
    if(todayLog) out.push(todayLogBanner(todayLog));
  }

  $('#todayBody').innerHTML = out.join('');
  bindToday();
}

function heroHTML(w, city){
  const gap = w.warmT - w.coldT;
  const parts = [];
  parts.push(`<div class="hero ${w.theme}${w.isDay ? '' : ' night'}">`);
  parts.push(`<div class="hero-top">
      <div>
        <div class="hero-date">${fmtDate(w.date)}</div>
        <div class="hero-city">📍 ${esc(city.name)}${city.admin ? ' · ' + esc(city.admin) : ''}</div>
      </div>
      <div class="hero-emoji">${w.emoji}</div>
    </div>`);
  parts.push(`<div class="hero-temp"><span class="temp-num">${w.temp}</span><span class="deg">°</span><span class="hero-desc">${w.desc}</span></div>`);
  parts.push(`<div class="hero-sub">体感 ${w.feels}° · 最高 ${w.tMax}° / 最低 ${w.tMin}° · 湿度 ${w.humidity}%</div>`);
  parts.push(`<div class="hero-chips">
      <span class="chip">💧 降水 ${w.rainProb}%</span>
      <span class="chip">🌬 风 ${w.wind} km/h</span>
      <span class="chip">🔆 紫外线 ${w.uv}</span>
    </div>`);
  const timeParts = [];
  if(w.morning != null) timeParts.push(`早 ${w.morning}°`);
  if(w.noon != null) timeParts.push(`午 ${w.noon}°`);
  if(w.evening != null) timeParts.push(`晚 ${w.evening}°`);
  if(w.sunrise) timeParts.push(`日出 ${w.sunrise}`);
  parts.push(`<div class="hero-foot">
      <span>${timeParts.join(' · ')}</span>
      <button id="refreshWeather">更新</button>
    </div>`);
  parts.push('</div>');
  if(gap >= 9){
    parts.push(`<div class="hint">今天温差 ${gap}℃，推荐里帮你留了可穿脱的外套</div>`);
  }
  return parts.join('');
}

function bindToday(){
  const refresh = $('#refreshWeather');
  if(refresh) refresh.onclick = () => loadWeather(true);
  const retry = $('#retryWeather');
  if(retry) retry.onclick = () => { state.weatherError = false; renderToday(); loadWeather(true); };
  const pick = $('#pickCityBtn');
  if(pick) pick.onclick = openCitySheet;
  const firstAdd = $('#firstAddBtn');
  if(firstAdd) firstAdd.onclick = () => openItemSheet(null);
  const shuffle = $('#shuffleBtn');
  if(shuffle) shuffle.onclick = () => {
    state.rec = buildOutfit(state.locks);
    renderToday();
  };
  const logBtn = $('#logBtn');
  if(logBtn) logBtn.onclick = logOutfit;
  const viewLog = $('#viewLogBtn');
  if(viewLog) viewLog.onclick = () => switchTab('logs');
  $$('.occ-chip').forEach(btn => {
    btn.onclick = () => {
      state.occasion = btn.dataset.occ;
      try{ localStorage.setItem(occasionKey(), state.occasion); }catch(e){}
      state.rec = null;
      renderToday();
    };
  });
  $$('.outfit-item').forEach(el => {
    el.onclick = () => {
      const id = el.dataset.id;
      if(state.locks.has(id)) state.locks.delete(id);
      else state.locks.add(id);
      renderToday();
    };
  });
  $$('.edit-badge').forEach(btn => {
    btn.onclick = e => {
      e.stopPropagation();
      const it = state.items.find(i => i.id === btn.dataset.edit);
      if(it) openItemSheet(it);
    };
  });

function fmtDate(dateStr){

  return `${d.getMonth()+1}月${d.getDate()}日 · ${DAY_NAMES[d.getDay()]}`;
}

function renderWardrobe(){
  const items = state.items;
  const counts = { all: items.length };
  for(const c of CAT_ORDER) counts[c] = items.filter(i => i.category === c).length;

  const filters = [['all','全部'], ...CAT_ORDER.map(c => [c, CATS[c].label])].map(([key,label]) => `
    <button class="filter ${state.filter === key ? 'active' : ''}" data-filter="${key}">
      ${label}<span class="count">${counts[key] || 0}</span>
    </button>`).join('');

  let list = items;
  if(state.filter !== 'all') list = items.filter(i => i.category === state.filter);
  list = [...list].sort((a,b) => {
    const ca = CAT_ORDER.indexOf(a.category), cb = CAT_ORDER.indexOf(b.category);
    if(ca !== cb) return ca - cb;
    return (b.createdAt || 0) - (a.createdAt || 0);

/* ---------------- actions ---------------- */
function switchTab(tab){
  state.tab = tab;
  $$('.tab').forEach(el => el.classList.toggle('active', el.id === 'tab-' + tab));
  $$('.tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  if(tab === 'wardrobe') renderWardrobe();
  if(tab === 'logs') renderLogs();
  if(tab === 'settings') renderSettings();
  window.scrollTo({ top:0, behavior:'smooth' });
}

async function logOutfit(){
  if(!state.rec || !state.weather) return;
  const w = state.weather;
  const log = {
    id: w.date,
    date: w.date,
    itemIds: state.rec.items.map(i => i.id),
    weather: { desc:w.desc, tMax:w.tMax, tMin:w.tMin, feels:w.feels },
    createdAt: new Date().toISOString()
  };
  await dbPut('logs', log);
  for(const it of state.rec.items){
    it.lastWorn = w.date;
    it.wornCount = (it.wornCount || 0) + 1;
    await dbPut('items', it);
  }
  state.logs = await dbAll('logs');
  renderToday();
  toast('已记下今天的穿搭');
}

async function setCity(city, opts = {}){
  state.settings.city = city;
  await metaPut('settings', state.settings);
  localStorage.setItem('outfit.city', JSON.stringify(city));
  $('#cityBtn').textContent = '📍 ' + city.name;
  state.weather = null;
  state.rec = null;
  closeSheet();
  renderToday();
  if(opts.refresh !== false) loadWeather(true);
}

async function loadWeather(force = false){
  const city = state.settings.city;
  if(!city) return;
  if(!force && state.weather && Date.now() - state.weatherAt < 15 * 60 * 1000){
    return;
  }
  try{
    const w = await fetchWeather(city);
    state.weather = w;
    state.weatherAt = Date.now();
    state.weatherError = false;
    state.rec = null;
    try{
      localStorage.setItem('outfit.weather', JSON.stringify({ city, w, at: state.weatherAt }));
    }catch(e){}
    renderToday();
  }catch(err){
    console.warn(err);
    try{
      const cached = JSON.parse(localStorage.getItem('outfit.weather') || 'null');
      if(cached && cached.w && cached.city && cached.city.lat === city.lat && cached.city.lon === city.lon){
        state.weather = cached.w;
        state.weatherAt = cached.at || Date.now();
        state.rec = null;
        renderToday();
        toast('天气更新失败，显示上次的数据');
        return;
      }
    }catch(e){}
    state.weatherError = true;
    toast('天气获取失败，请检查网络后重试');
    renderToday();
  }
}

/* ---------------- 照片取色 ---------------- */
let picker = null;

function openColorPicker(){
  if(!form || !form.photo){ toast('先添加一张照片'); return; }
  picker = null;
  const overlay = $('#colorPicker');
  overlay.classList.add('show');
  document.body.style.overflow = 'hidden';
  const img = $('#pickerImg');
  img.onload = () => setupPicker(img);
  img.src = form.photo;
  if(img.complete && img.naturalWidth) setupPicker(img);
}

function setupPicker(img){
  if(picker || !$('#colorPicker').classList.contains('show')) return;
  if(!img.naturalWidth){ return; }
  const max = 1200;
  const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
  canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
  const ctx = canvas.getContext('2d', { willReadFrequently:true });
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  picker = { img, canvas, ctx, hex: form.hex, name: form.colorName, dragging:false };

  const r = img.getBoundingClientRect();
  if(!r.width || !r.height){
    setTimeout(() => setupPicker(img), 80);
    return;
  }
  updatePickerAtScreen(r.left + r.width / 2, r.top + r.height / 2);
}

function updatePickerAtScreen(clientX, clientY){
  if(!picker) return;
  const img = $('#pickerImg');
  const r = img.getBoundingClientRect();
  if(!r.width || !r.height) return;
  const nx = clamp((clientX - r.left) / r.width, 0, 1);
  const ny = clamp((clientY - r.top) / r.height, 0, 1);
  const px = nx * picker.canvas.width;
  const py = ny * picker.canvas.height;
  samplePickerPixel(px, py);
  placePickerMarker(clientX, clientY, px, py);
}

function samplePickerPixel(px, py){
  const { canvas, ctx } = picker;
  const R = 3;
  const x0 = clamp(Math.round(px) - R, 0, canvas.width - 1);
  const y0 = clamp(Math.round(py) - R, 0, canvas.height - 1);
  const w = Math.min(R * 2 + 1, canvas.width - x0);
  const h = Math.min(R * 2 + 1, canvas.height - y0);
  const d = ctx.getImageData(x0, y0, w, h).data;
  let r = 0, g = 0, b = 0, n = 0;
  for(let i = 0; i < d.length; i += 4){
    if(d[i+3] < 128) continue;
    r += d[i]; g += d[i+1]; b += d[i+2]; n++;
  }
  if(!n) return;
  const hex = rgbToHex(r / n, g / n, b / n);
  picker.hex = hex;
  picker.name = colorName(hex);
  $('#pickerSwatch').style.background = hex;
  $('#pickerColorName').textContent = picker.name;
  $('#pickerHex').textContent = hex.toUpperCase();
}

function placePickerMarker(clientX, clientY, px, py){
  const stage = $('#pickerStage');
  const sr = stage.getBoundingClientRect();
  const x = clamp(clientX - sr.left, 0, sr.width);
  const y = clamp(clientY - sr.top, 0, sr.height);
  const cross = $('#pickerCross'), loupe = $('#pickerLoupe');
  cross.style.left = x + 'px';
  cross.style.top = y + 'px';
  cross.style.display = 'block';
  const lx = clamp(x + 20, 6, Math.max(6, sr.width - 102));
  const ly = clamp(y - 118, 6, Math.max(6, sr.height - 102));
  loupe.style.left = lx + 'px';
  loupe.style.top = ly + 'px';
  loupe.style.display = 'block';

  const lc = loupe.getContext('2d');
  const S = 18;
  const sx = clamp(px - S / 2, 0, picker.canvas.width - S);
  const sy = clamp(py - S / 2, 0, picker.canvas.height - S);
  lc.imageSmoothingEnabled = false;
  lc.clearRect(0, 0, 96, 96);
  lc.drawImage(picker.canvas, sx, sy, S, S, 0, 0, 96, 96);
  lc.strokeStyle = 'rgba(255,255,255,.95)';
  lc.lineWidth = 2;
  lc.strokeRect(40, 40, 16, 16);
  lc.strokeStyle = 'rgba(0,0,0,.45)';
  lc.lineWidth = 1;
  lc.strokeRect(39, 39, 18, 18);
}

function bindPicker(){
  const stage = $('#pickerStage');
  stage.addEventListener('pointerdown', e => {
    if(!picker) return;
    picker.dragging = true;
    try{ stage.setPointerCapture(e.pointerId); }catch(err){}
    updatePickerAtScreen(e.clientX, e.clientY);
    e.preventDefault();
  });
  stage.addEventListener('pointermove', e => {
    if(!picker || !picker.dragging) return;
    updatePickerAtScreen(e.clientX, e.clientY);
    e.preventDefault();
  });
  const end = e => {
    if(!picker) return;
    picker.dragging = false;
    try{ stage.releasePointerCapture(e.pointerId); }catch(err){}
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
}

function usePickedColor(){
  if(!picker){ closeColorPicker(); return; }
  const hex = picker.hex, name = picker.name;
  setFormColor(hex, name);
  renderSwatches();
  closeColorPicker();
  toast('已取色：' + name);
}

function closeColorPicker(){
  picker = null;
  $('#colorPicker').classList.remove('show');
  document.body.style.overflow = openSheetEl ? 'hidden' : '';
}


function updateWarmUI(){
  const v = +$('#fWarm').value;
  form.warmth = v;
  $('#warmLabel').textContent = WARM_LABELS[v];
  const pct = ((v - 1) / 4) * 100;
  $('#fWarm').style.background = `linear-gradient(to right, var(--accent) 0%, var(--accent) ${pct}%, #e7ddd0 ${pct}%, #e7ddd0 100%)`;
}

function updatePhotoUI(){
  const img = $('#previewImg'), hint = $('#photoHint'), change = $('#photoChange');
  if(form.photo){
    img.src = form.photo;
    img.classList.remove('hidden');
    hint.classList.add('hidden');
    change.classList.remove('hidden');
  }else{
    img.removeAttribute('src');
    img.classList.add('hidden');
    hint.classList.remove('hidden');
    change.classList.add('hidden');
  }
}

async function handlePhoto(file){
  if(!file) return;
  if(!file.type.startsWith('image/')){ toast('请选择图片文件'); return; }
  toast('正在处理照片…');
  try{
    const data = await compressImage(file);
    form.photo = data;
    updatePhotoUI();
    const hex = await extractColor(data);
    setFormColor(hex, colorName(hex));
    renderSwatches();
    toast('照片已添加，颜色识别为「' + colorName(hex) + '」');
  }catch(e){
    console.warn(e);
    toast('照片处理失败，换一张试试');
  }
}

async function saveItem(){
  if(!form) return;
  const name = $('#fName').value.trim() || `${CATS[form.category].label} ${state.items.filter(i => i.category === form.category).length + 1}`;
  const base = state.editing ? { ...state.editing } : {
    id: uid(), createdAt: Date.now(), wornCount: 0, lastWorn: null
  };
  const item = Object.assign(base, {
    name,
    category: form.category,
    warmth: +$('#fWarm').value,
    hex: form.hex,
    colorName: form.colorName,
    photo: form.photo,
    style: form.style,
    fit: form.fit,
    pattern: form.pattern,
    tags: [...form.tags],
    note: $('#fNote').value.trim()
  });
  await dbPut('items', item);
  if(state.editing){
    const idx = state.items.findIndex(i => i.id === item.id);
    if(idx >= 0) state.items[idx] = item; else state.items.push(item);
  }else{
    state.items.push(item);
  }
  state.rec = null;
  closeSheet();
  renderToday();
  renderWardrobe();
  toast(state.editing ? '已保存' : '已加入衣橱');
}

async function deleteItem(){
  if(!state.editing) return;
  if(!confirm('删除这件单品？')) return;
  await dbDel('items', state.editing.id);
  state.items = state.items.filter(i => i.id !== state.editing.id);
  state.locks.delete(state.editing.id);
  state.rec = null;
  closeSheet();
  renderWardrobe(); renderToday();
  toast('已删除');
}

/* ---------------- sheets ---------------- */
let openSheetEl = null;
function openSheet(el){
  if(openSheetEl) openSheetEl.classList.remove('show');
  openSheetEl = el;
  el.classList.add('show');
  $('#backdrop').classList.add('show');
  document.body.style.overflow = 'hidden';
  el.scrollTop = 0;
}
function closeSheet(){
  if(openSheetEl){ openSheetEl.classList.remove('show'); openSheetEl = null; }
  $('#backdrop').classList.remove('show');
  document.body.style.overflow = '';
}

/* ---------------- city ---------------- */
function openCitySheet(){
  $('#cityInput').value = '';
  $('#cityResults').innerHTML = '';
  renderCityPresets();
  renderIpSuggest();
  openSheet($('#citySheet'));
  setTimeout(() => $('#cityInput').focus(), 320);
}

function renderIpSuggest(){
  const box = $('#ipSuggest');
  if(!box) return;
  const c = state.ipCity;
  if(!c || state.settings.city){ box.innerHTML = ''; return; }
  box.innerHTML = `<button class="ip-suggest" id="useIpCity">
      <span>📍 网络定位：${esc(c.name)}${c.admin ? ' · ' + esc(c.admin) : ''}</span>
      <span class="use">使用</span>
    </button>`;
  $('#useIpCity').onclick = () => {
    setCity(c);
    toast('已切换到 ' + c.name);
  };
}

function renderCityPresets(){
  const cities = ['北京','上海','广州','深圳','杭州','成都','武汉','南京','西安','重庆'];
  $('#cityPresets').innerHTML = cities.map(c => `<button data-city="${c}">${c}</button>`).join('');
  $$('#cityPresets button').forEach(btn => {
    btn.onclick = () => {
      $('#cityInput').value = btn.dataset.city;
      searchCityNow(btn.dataset.city);
    };
  });
}

let cityTimer = null;
function bindCitySheet(){
  $('#cityInput').addEventListener('input', () => {
    clearTimeout(cityTimer);
    const q = $('#cityInput').value.trim();
    if(!q){ $('#cityResults').innerHTML = ''; return; }
    cityTimer = setTimeout(() => searchCityNow(q), 380);
  });
  $('#locateBtn').onclick = locateMe;
}

async function searchCityNow(q){
  const box = $('#cityResults');
  box.innerHTML = '<div class="muted" style="padding:12px 4px;font-size:13px">搜索中…</div>';
  try{
    const list = await searchCity(q);
    if(!list.length){
      box.innerHTML = '<div class="muted" style="padding:12px 4px;font-size:13px">没找到这个城市，试试拼音或附近的大城市</div>';
      return;
    }
    box.innerHTML = list.map((c,i) => `
      <button class="city-item" data-i="${i}">
        <span>${esc(c.name)}</span>
        <span class="meta">${esc([c.admin, c.country].filter(Boolean).join(' · '))}</span>
      </button>`).join('');
    $$('.city-item').forEach(btn => {
      btn.onclick = () => {
        const c = list[+btn.dataset.i];
        setCity(c);
        toast('已切换到 ' + c.name);
      };
    });
  }catch(e){
    box.innerHTML = '<div class="muted" style="padding:12px 4px;font-size:13px">搜索失败，请检查网络</div>';
  }
}

function locateMe(){
  if(!navigator.geolocation){ toast('当前浏览器不支持定位'); return; }
  toast('正在定位…');
  navigator.geolocation.getCurrentPosition(async pos => {
    const { latitude:lat, longitude:lon } = pos.coords;
    const name = await reverseName(lat, lon);
    setCity({ name, admin:'', country:'', lat, lon });
    toast('已定位到 ' + name);
  }, err => {
    console.warn(err);
    toast('定位失败，请手动搜索城市');
  }, { enableHighAccuracy:false, timeout:10000, maximumAge:600000 });
}

/* ---------------- data ---------------- */
function exportData(){
  const data = {
    app: 'today-outfit',
    version: 1,
    exportedAt: new Date().toISOString(),
    settings: state.settings,
    items: state.items,
    logs: state.logs
  };
  const blob = new Blob([JSON.stringify(data)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `穿搭备份-${localDate()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('已导出备份文件');
}

async function onImportFile(e){
  const file = e.target.files?.[0];
  if(!file) return;
  try{
    const data = JSON.parse(await file.text());
    if(!Array.isArray(data.items)) throw new Error('bad file');
    if(!confirm(`导入 ${data.items.length} 件单品和 ${(data.logs || []).length} 条记录？同名数据会覆盖。`)) return;
    for(const it of data.items) await dbPut('items', it);
    for(const lg of data.logs || []) await dbPut('logs', lg);
    if(data.settings && data.settings.city){
      state.settings = data.settings;
      await metaPut('settings', state.settings);
      localStorage.setItem('outfit.city', JSON.stringify(data.settings.city));
    }
    state.items = await dbAll('items');
    state.logs = await dbAll('logs');
    state.rec = null;
    renderAll();
    updateCityBtn();
    if(state.settings.city) loadWeather(true);
    toast('导入完成');
  }catch(err){
    console.warn(err);
    toast('导入失败，文件格式不对');
  }finally{
    e.target.value = '';
  }
}

async function clearAll(){
  if(!confirm('确定清空全部数据？所有单品、照片和记录都会被删除，且无法恢复。')) return;
  if(!confirm('再确认一次：真的要清空吗？建议先导出备份。')) return;
  for(const s of ['items','logs','meta']){
    await new Promise((resolve, reject) => {
      const r = db.transaction(s, 'readwrite').objectStore(s).clear();
      r.onsuccess = resolve; r.onerror = reject;
    });
  }
  localStorage.removeItem('outfit.city');
  localStorage.removeItem('outfit.weather');
  state.items = []; state.logs = []; state.settings = { city:null };
  state.weather = null; state.rec = null; state.locks.clear();
  updateCityBtn();
  renderAll();
  toast('已清空');
}

/* ---------------- init ---------------- */
function updateCityBtn(){
  const c = state.settings.city;
  $('#cityBtn').textContent = c ? '📍 ' + c.name : '📍 设置城市';
}

function renderAll(){
  renderToday(); renderWardrobe(); renderLogs(); renderSettings();
}

function bindStatic(){
  $('#cityBtn').onclick = openCitySheet;
  $$('.tabbar button').forEach(btn => btn.onclick = () => switchTab(btn.dataset.tab));
  $('#backdrop').onclick = closeSheet;
  $$('[data-close]').forEach(btn => btn.onclick = closeSheet);

  // photo
  const drop = $('#photoDrop');
  drop.onclick = () => $('#photoInput').click();
  $('#photoInput').onchange = e => {
    const f = e.target.files?.[0];
    e.target.value = '';
    handlePhoto(f);
  };

  // form
  $('#fWarm').addEventListener('input', updateWarmUI);
  $('#fName').addEventListener('input', () => { form.nameTouched = true; });
  $('#fColor').addEventListener('input', e => {
    setFormColor(e.target.value, colorName(e.target.value));
    renderSwatches();
  });
  $('#colorSwatch').onclick = () => $('#fColor').click();
  $('#pickColor').onclick = openColorPicker;
  $('#pickerCancel').onclick = closeColorPicker;
  $('#pickerUse').onclick = usePickedColor;
  bindPicker();
  $('#reExtract').onclick = async () => {
    if(!form.photo){ toast('先添加一张照片'); return; }
    toast('正在识别…');
    try{
      const hex = await extractColor(form.photo);
      setFormColor(hex, colorName(hex));
      renderSwatches();
      toast('识别为「' + colorName(hex) + '」');
    }catch(e){ toast('识别失败，请手动选择'); }
  };
  $('#saveItem').onclick = saveItem;
  $('#deleteItem').onclick = deleteItem;

  bindCitySheet();

  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible' && state.settings.city){
      if(Date.now() - state.weatherAt > 30 * 60 * 1000) loadWeather(true);
    }
  });
}

async function init(){
  try{
    await openDB();
  }catch(e){
    console.error(e);
    toast('浏览器存储不可用，数据无法保存');
  }
  try{
    state.items = await dbAll('items');
    state.logs = await dbAll('logs');
    const saved = await metaGet('settings');
    if(saved && saved.city) state.settings = saved;
  }catch(e){ console.warn(e); }

  if(!state.settings.city){
    try{
      const c = JSON.parse(localStorage.getItem('outfit.city') || 'null');
      if(c && c.lat != null) state.settings.city = c;
    }catch(e){}
  }

  loadOccasion();
  bindStatic();
  updateCityBtn();
  renderAll();

  // 先用缓存天气立即出图，再后台更新
  try{
    const cached = JSON.parse(localStorage.getItem('outfit.weather') || 'null');
    if(cached && cached.w && state.settings.city &&
       cached.city.lat === state.settings.city.lat && cached.city.lon === state.settings.city.lon){
      state.weather = cached.w;
      state.weatherAt = cached.at || 0;
      renderToday();
    }
  }catch(e){}

  if(state.settings.city){
    loadWeather(!state.weather);
  }else{
    // 没有城市时先把选择面板打开，IP 定位只作为建议，不自动切换
    openCitySheet();
    guessCityByIP().then(c => {
      state.ipCity = c;
      if(openSheetEl === $('#citySheet')) renderIpSuggest();
    }).catch(() => {});
  }

  if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
